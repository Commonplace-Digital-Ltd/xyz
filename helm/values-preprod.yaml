# These values apply to the preprod environment, and overrides config in values.yaml
# as needed.
#
# This values file is applied on each deployment to the environment by AWS Codepipeline.
#
env:
  XYZ_ENV: preprod
  MONGODB_URL: mongodb+srv://commonplace-preprod-pre-prod-pl-0.rcb9r.mongodb.net?retryWrites=true&w=3&readPreference=nearest

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 200
  targetMemoryUtilizationPercentage: 200
